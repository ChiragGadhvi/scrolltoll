name: scrolltoll
description: "Rotto - A friendly screen-time companion for the apps you choose"
publish_to: 'none'

version: 2.1.0+11

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  usage_stats: ^1.0.4
  flutter_local_notifications: ^17.1.2
  home_widget: ^0.9.0
  intl: ^0.19.0
  flutter_animate: ^4.5.0
  path_provider: ^2.1.2
  timezone: ^0.9.4
  device_apps: ^2.2.0
  flutter_timezone: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.8
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: true
  ios: false
  # Legacy square icon for pre-API-26 launchers: opaque, matching the Play
  # listing icon.
  image_path: "assets/ic_launcher.png"
  min_sdk_android: 24
  # Lilac rather than white, so the adaptive icon matches the store icon and the
  # brand instead of sitting on a bare white tile.
  adaptive_icon_background: "#E2D7F8"
  # A dedicated transparent foreground. Reusing image_path here meant Rotto's
  # own margin was then inset a further 16% by the generated adaptive XML, so he
  # ended up at ~42% of the canvas and read tiny on the home screen.
  adaptive_icon_foreground: "assets/ic_launcher_foreground.png"

flutter_native_splash:
  color: "#F7F7F9"
  image: assets/ic_splash.png
  android: true
  ios: false
  android_12:
    image: assets/ic_splash.png
    color: "#F7F7F9"
    icon_background_color: "#F7F7F9"

flutter:
  uses-material-design: true
  assets:
    - assets/rotto_energetic.webp
    - assets/rotto_scrolling.webp
    - assets/rotto_tired.webp
    - assets/rotto_bingemode.webp
    - assets/rotto_noenergy.webp
    - assets/rotto_base.webp
    - assets/rotto_empty.webp
    - assets/rotto_waiting.webp
    - assets/rotto_energetic.png
    - assets/rotto_scrolling.png
    - assets/rotto_tired.png
    - assets/rotto_bingemode.png
    - assets/rotto_noenergy.png
    - assets/rotto_base.png
    - assets/rotto_face.png
    - assets/rotto_empty.png
    - assets/rotto_waiting.png

  # Vendored rather than fetched at runtime: the release build has no INTERNET
  # permission, so google_fonts could never have worked in the shipped app.
  # Licence: assets/fonts/OFL.txt
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Poppins-Black.ttf
          weight: 900
